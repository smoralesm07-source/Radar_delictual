name: IGR production promotion

on:
  push:
    branches: [release/igr-production]
    paths:
      - 'scripts/promote_igr_production.py'
      - '.github/workflows/igr-production-promotion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/igr-production
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Aplicar promoción
        run: python scripts/promote_igr_production.py

      - name: Restaurar datos Radar
        shell: bash
        run: |
          git fetch origin radar-data || true
          mkdir -p data/processed data/evidence
          for f in \
            cead_update_manifest.json \
            cead_annual_master_v4.jsonl \
            cead_official_secondary_control.jsonl \
            censo2024_population_commune.json; do
              git show "origin/radar-data:data/processed/$f" > "data/processed/$f" 2>/dev/null || rm -f "data/processed/$f"
          done
          rm -f data/processed/cead_direct_annual_cache.jsonl

      - name: Ejecutar pruebas
        run: pytest -q

      - name: Materializar IGR promovido
        run: python run.py --offline

      - name: Verificar contrato productivo
        shell: python
        run: |
          import json
          from pathlib import Path

          current = json.loads(Path('data/processed/cead_geographic_score.json').read_text(encoding='utf-8'))
          legacy_alias = json.loads(Path('data/processed/cead_geographic_score_v1.json').read_text(encoding='utf-8'))
          candidate = json.loads(Path('data/processed/cead_geographic_score_v11_candidate.json').read_text(encoding='utf-8'))
          methodology = json.loads(Path('data/processed/cead_geographic_score_methodology.json').read_text(encoding='utf-8'))
          assert len(current) == 345
          assert current == candidate == legacy_alias
          assert methodology['version'] == '1.1.0'
          assert methodology['status'] == 'production'
          assert methodology['presentation_policy']['primary_outputs'] == ['score', 'national_percentile']
          assert all('national_percentile' in row for row in current)
          assert min(float(row['national_percentile']) for row in current) == 0.0
          assert max(float(row['national_percentile']) for row in current) == 100.0
          integration = json.loads(Path('data/processed/integration_ready.json').read_text(encoding='utf-8'))
          score_rows = [r for r in integration if r.get('signal_family') == 'cead_criminogenic_geographic_score']
          assert len(score_rows) == 345
          assert all(r.get('score_version') == '1.1.0' for r in score_rows)

      - name: Guardar promoción validada
        shell: bash
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add config/cead_geographic_score_v11_candidate.json \
                  radar_delictual/geographic_score_v11_runtime.py \
                  tests/test_geographic_score_v11_rc1.py
          if ! git diff --cached --quiet; then
            git commit -m "Promueve IGR a producción"
            git push origin HEAD:release/igr-production
          fi
