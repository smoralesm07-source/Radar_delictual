name: IGR v1.1 band strategy

on:
  push:
    branches: [analysis/igr-v11-band-strategy]
    paths:
      - 'scripts/evaluate_igr_v11_band_strategy.py'
      - '.github/workflows/igr-v11-band-strategy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/igr-v11-band-strategy
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restaurar datos Radar
        shell: bash
        run: |
          git fetch origin radar-data || true
          mkdir -p data/processed
          for f in cead_annual_master_v4.jsonl censo2024_population_commune.json; do
            git show "origin/radar-data:data/processed/$f" > "data/processed/$f"
          done

      - name: Ejecutar evaluación comparativa
        run: PYTHONPATH=. python scripts/evaluate_igr_v11_band_strategy.py

      - name: Guardar diagnóstico reproducible
        shell: bash
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add analysis/igr_v11_band_strategy_evaluation.json
          if ! git diff --cached --quiet; then
            git commit -m "analysis: guarda evaluación de bandas IGR v1.1 [skip ci]"
            git push origin HEAD:analysis/igr-v11-band-strategy
          fi
