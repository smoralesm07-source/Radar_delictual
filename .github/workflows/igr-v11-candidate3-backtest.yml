name: IGR v1.1 candidate.3 temporal backtest

on:
  push:
    branches: [experiment/igr-v11-c3-anomaly-shrink]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/igr-v11-c3-anomaly-shrink
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restaurar serie CEAD y población
        shell: bash
        run: |
          git fetch origin radar-data
          mkdir -p data/processed public analysis
          git show origin/radar-data:data/processed/cead_annual_master_v4.jsonl > data/processed/cead_annual_master_v4.jsonl
          git show origin/radar-data:data/processed/censo2024_population_commune.json > data/processed/censo2024_population_commune.json

      - name: Ejecutar backtest 2023-2025
        run: python scripts/backtest_igr_v11_candidate3.py

      - name: Guardar backtest
        shell: bash
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add analysis/igr_v11_candidate3_backtest_2023_2025.json
          if ! git diff --cached --quiet; then
            git commit -m "IGR v1.1 candidate.3: backtest temporal de bandas"
            git push origin HEAD:experiment/igr-v11-c3-anomaly-shrink
          fi
