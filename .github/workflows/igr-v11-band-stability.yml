name: IGR v1.1 band stability strategies

on:
  push:
    branches: [experiment/igr-v11-c3-anomaly-shrink]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/igr-v11-c3-anomaly-shrink
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restaurar datos de evaluación
        shell: bash
        run: |
          git fetch origin radar-data
          mkdir -p data/processed public analysis
          git show origin/radar-data:data/processed/cead_annual_master_v4.jsonl > data/processed/cead_annual_master_v4.jsonl
          git show origin/radar-data:data/processed/censo2024_population_commune.json > data/processed/censo2024_population_commune.json
          git show origin/radar-data:data/processed/cead_geographic_score_v1.json > data/processed/cead_geographic_score_v1.json

      - name: Comparar estrategias de estabilidad
        run: PYTHONPATH=. python scripts/evaluate_igr_v11_band_stability.py

      - name: Guardar análisis
        shell: bash
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add analysis/igr_v11_candidate3_band_stability_strategies.json
          if ! git diff --cached --quiet; then
            git commit -m "IGR v1.1 candidate.3: evalúa estabilidad de bandas"
            git push origin HEAD:experiment/igr-v11-c3-anomaly-shrink
          fi
