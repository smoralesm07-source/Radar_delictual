name: IGR v1.1 candidate CI

on:
  push:
    branches: [experiment/igr-v11]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restaurar corte CEAD vigente
        shell: bash
        run: |
          git fetch origin radar-data || true
          mkdir -p data/processed public
          for f in cead_annual_master_v4.jsonl cead_geographic_score_v1.json censo2024_population_commune.json; do
            git show "origin/radar-data:data/processed/$f" > "data/processed/$f" 2>/dev/null || rm -f "data/processed/$f"
          done
          echo '{}' > public/data.json
      - name: Pruebas
        run: pytest -q
      - name: Materializar candidato
        run: |
          python - <<'PY'
          import json
          from radar_delictual.geographic_score_v11_runtime import materialize_geographic_score_v11_candidate
          print(json.dumps(materialize_geographic_score_v11_candidate(), ensure_ascii=False, indent=2))
          PY
