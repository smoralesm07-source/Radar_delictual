name: IGR v1.1 candidate.3 evaluation

on:
  push:
    branches: [experiment/igr-v11-c3-anomaly-shrink]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/igr-v11-c3-anomaly-shrink
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Aplicar candidate.3
        run: python scripts/patch_igr_v11_candidate3.py

      - name: Revisar parche
        run: git diff --check

      - name: Pruebas
        run: pytest -q

      - name: Restaurar cortes de evaluación
        shell: bash
        run: |
          git fetch origin radar-data
          mkdir -p data/processed public analysis
          git show origin/radar-data:data/processed/cead_annual_master_v4.jsonl > data/processed/cead_annual_master_v4.jsonl
          git show origin/radar-data:data/processed/censo2024_population_commune.json > data/processed/censo2024_population_commune.json
          git show origin/radar-data:data/processed/cead_geographic_score_v1.json > data/processed/cead_geographic_score_v1.json
          git show origin/radar-data:data/processed/cead_geographic_score_v11_candidate.json > /tmp/candidate2.json
          echo '{}' > public/data.json

      - name: Materializar candidate.3
        run: |
          python - <<'PY'
          import json
          from radar_delictual.geographic_score_v11_runtime import materialize_geographic_score_v11_candidate
          result = materialize_geographic_score_v11_candidate(offline=True)
          print(json.dumps(result, ensure_ascii=False, indent=2))
          if not result.get('ok') or result.get('records', 0) < 300:
              raise SystemExit('candidate.3 incompleto')
          PY

      - name: Diagnóstico de cambios y calibración
        run: |
          python - <<'PY'
          import json, math, statistics
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          v1 = load('data/processed/cead_geographic_score_v1.json')
          c2 = load('/tmp/candidate2.json')
          c3 = load('data/processed/cead_geographic_score_v11_candidate.json')
          v1m = {r['territory_id']: r for r in v1}
          c2m = {r['territory_id']: r for r in c2}
          c3m = {r['territory_id']: r for r in c3}
          ids = sorted(set(v1m) & set(c3m))

          order = {'Muy bajo': 0, 'Bajo': 1, 'Medio': 2, 'Alto': 3, 'Muy alto': 4}
          def legacy_level(score):
              if score is None: return None
              return 'Muy alto' if score >= 80 else 'Alto' if score >= 65 else 'Medio' if score >= 45 else 'Bajo' if score >= 25 else 'Muy bajo'

          def corr(xs, ys):
              pairs = [(float(x), float(y)) for x, y in zip(xs, ys) if x is not None and y is not None]
              if len(pairs) < 3: return None
              ax = sum(x for x, _ in pairs) / len(pairs)
              ay = sum(y for _, y in pairs) / len(pairs)
              num = sum((x-ax)*(y-ay) for x, y in pairs)
              dx = math.sqrt(sum((x-ax)**2 for x, _ in pairs))
              dy = math.sqrt(sum((y-ay)**2 for _, y in pairs))
              return num/(dx*dy) if dx and dy else None

          def rank_map(rows):
              ordered = sorted(rows, key=lambda x: (-float(x[1]), x[0]))
              return {tid: i+1 for i, (tid, _) in enumerate(ordered)}

          v1_scores = [float(v1m[i]['score']) for i in ids]
          c3_scores = [float(c3m[i]['score']) for i in ids]
          v1r = rank_map([(i, v1m[i]['score']) for i in ids])
          c3r = rank_map([(i, c3m[i]['score']) for i in ids])
          populations = [float(c3m[i].get('population') or 0) for i in ids]
          valid_pop = [(i, p) for i, p in zip(ids, populations) if p > 0]

          def component_effects(old, new):
              rate_effect = 0.0
              anomaly_effect = 0.0
              for layer_key, old_layer in (old.get('layers') or {}).items():
                  new_layer = (new.get('layers') or {}).get(layer_key) or {}
                  oldc = {c.get('id'): c for c in old_layer.get('components', [])}
                  newc = {c.get('id'): c for c in new_layer.get('components', [])}
                  common = [k for k in oldc if k in newc]
                  if not common:
                      continue
                  weights = [float(oldc[k].get('configured_weight') or 0) for k in common]
                  sw = sum(weights) or 1.0
                  lw = float(old_layer.get('configured_weight') or 0)
                  for k, cw in zip(common, weights):
                      oi = float(oldc[k].get('intensity') or 0)
                      ni = float(newc[k].get('intensity') or 0)
                      oa = float(oldc[k].get('anomaly') or 0)
                      na = float(newc[k].get('temporal_anomaly') or 0)
                      rate_effect += lw * (cw/sw) * 0.40 * (ni-oi)
                      anomaly_effect += lw * (cw/sw) * 0.15 * (na-oa)
              return rate_effect, anomaly_effect

          transitions = {}
          legacy_changed = []
          drivers = {'tasa_poblacion': 0, 'anomalia_temporal': 0}
          upgrades = []
          downgrades = []
          for i in ids:
              old_level = v1m[i].get('level') or legacy_level(float(v1m[i]['score']))
              new_level = legacy_level(float(c3m[i]['score']))
              transitions[f'{old_level} -> {new_level}'] = transitions.get(f'{old_level} -> {new_level}', 0) + 1
              if old_level != new_level:
                  re, ae = component_effects(v1m[i], c3m[i])
                  driver = 'tasa_poblacion' if abs(re) > abs(ae) else 'anomalia_temporal'
                  drivers[driver] += 1
                  row = {
                      'territory_id': i,
                      'commune_name': c3m[i].get('commune_name'),
                      'region_name': c3m[i].get('region_name'),
                      'v1_level': old_level,
                      'legacy_candidate_level': new_level,
                      'v1_score': round(float(v1m[i]['score']), 2),
                      'candidate3_score': round(float(c3m[i]['score']), 2),
                      'delta': round(float(c3m[i]['score']) - float(v1m[i]['score']), 2),
                      'rate_population_effect': round(re, 2),
                      'temporal_anomaly_effect': round(ae, 2),
                      'dominant_driver': driver,
                      'population': c3m[i].get('population'),
                      'confidence': c3m[i].get('confidence'),
                  }
                  legacy_changed.append(row)
                  delta_band = order.get(new_level, 0) - order.get(old_level, 0)
                  (upgrades if delta_band > 0 else downgrades).append(row)

          def pop_stats(rows):
              ps = [float(r['population']) for r in rows if r.get('population')]
              return {
                  'n': len(rows),
                  'mean_population': round(statistics.mean(ps), 0) if ps else None,
                  'median_population': round(statistics.median(ps), 0) if ps else None,
                  'under_25000': sum(1 for p in ps if p < 25000),
              }

          # Calibración provisional: para cada frontera v1 buscamos el corte del
          # candidato con menor desacuerdo binario y, a igualdad, menos comunas
          # dentro de su incertidumbre leave-one-year-out.
          unique_scores = sorted({float(c3m[i]['score']) for i in ids})
          boundary_map = {}
          for target in (25.0, 45.0, 65.0, 80.0):
              best = None
              for thr in unique_scores:
                  wrong = 0
                  fragile = 0
                  for i in ids:
                      old_positive = float(v1m[i]['score']) >= target
                      new_positive = float(c3m[i]['score']) >= thr
                      wrong += int(old_positive != new_positive)
                      sd = max(float(c3m[i].get('stability_sd') or 0), 0.5)
                      fragile += int(abs(float(c3m[i]['score']) - thr) <= sd)
                  key = (wrong, fragile, abs(thr-target), thr)
                  if best is None or key < best[0]:
                      best = (key, thr, wrong, fragile)
              _, thr, wrong, fragile = best
              boundary_map[str(int(target))] = {
                  'candidate_threshold': round(thr, 2),
                  'binary_disagreement': wrong,
                  'fragile_communes': fragile,
              }

          t25 = boundary_map['25']['candidate_threshold']
          t45 = boundary_map['45']['candidate_threshold']
          t65 = boundary_map['65']['candidate_threshold']
          t80 = boundary_map['80']['candidate_threshold']
          def calibrated_level(score):
              return 'Muy alto' if score >= t80 else 'Alto' if score >= t65 else 'Medio' if score >= t45 else 'Bajo' if score >= t25 else 'Muy bajo'

          calibrated_changes = 0
          calibrated_counts = {}
          for i in ids:
              old_level = v1m[i].get('level') or legacy_level(float(v1m[i]['score']))
              cl = calibrated_level(float(c3m[i]['score']))
              calibrated_changes += int(old_level != cl)
              calibrated_counts[cl] = calibrated_counts.get(cl, 0) + 1

          c2_changes = 0
          c2_up_small = 0
          for i in ids:
              if i not in c2m: continue
              old_level = v1m[i].get('level') or legacy_level(float(v1m[i]['score']))
              l2 = legacy_level(float(c2m[i]['score']))
              if l2 != old_level:
                  c2_changes += 1
                  if order.get(l2,0) > order.get(old_level,0) and float(c3m[i].get('population') or 0) < 25000:
                      c2_up_small += 1

          anomaly_rels = []
          for r in c3:
              for layer in (r.get('layers') or {}).values():
                  for comp in layer.get('components', []):
                      if comp.get('temporal_anomaly_reliability') is not None:
                          anomaly_rels.append(float(comp['temporal_anomaly_reliability']))

          diagnostics = {
              'candidate_version': c3[0].get('score_version') if c3 else None,
              'production_replaced': False,
              'matched_communes': len(ids),
              'score_correlation_v1': round(corr(v1_scores, c3_scores), 4),
              'rank_correlation_v1': round(corr([v1r[i] for i in ids], [c3r[i] for i in ids]), 4),
              'population_bias': {
                  'v1_score_vs_log_population': round(corr([float(v1m[i]['score']) for i,p in valid_pop], [math.log(p) for i,p in valid_pop]), 4),
                  'candidate3_score_vs_log_population': round(corr([float(c3m[i]['score']) for i,p in valid_pop], [math.log(p) for i,p in valid_pop]), 4),
              },
              'legacy_threshold_diagnostic': {
                  'candidate2_level_changes': c2_changes,
                  'candidate3_level_changes': len(legacy_changed),
                  'candidate2_upgrades_under_25000_population': c2_up_small,
                  'candidate3_upgrades': pop_stats(upgrades),
                  'candidate3_downgrades': pop_stats(downgrades),
                  'dominant_driver': drivers,
                  'transitions': transitions,
              },
              'anomaly_support_shrinkage': {
                  'component_reliability_min': round(min(anomaly_rels), 1) if anomaly_rels else None,
                  'component_reliability_median': round(statistics.median(anomaly_rels), 1) if anomaly_rels else None,
                  'component_reliability_max': round(max(anomaly_rels), 1) if anomaly_rels else None,
              },
              'provisional_calibration': {
                  'status': 'diagnostic_only',
                  'method': 'minimize legacy boundary disagreement; ties minimize boundary fragility',
                  'thresholds': boundary_map,
                  'level_changes_vs_v1': calibrated_changes,
                  'agreement_pct': round(100.0*(len(ids)-calibrated_changes)/len(ids), 2),
                  'level_counts': calibrated_counts,
              },
              'largest_legacy_level_changes': sorted(legacy_changed, key=lambda r: abs(r['delta']), reverse=True)[:30],
          }
          Path('analysis/igr_v11_candidate3_diagnostics.json').write_text(
              json.dumps(diagnostics, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(diagnostics, ensure_ascii=False, indent=2))
          PY

      - name: Guardar candidato validado y diagnóstico
        shell: bash
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add config/cead_geographic_score_v11_candidate.json \
                  radar_delictual/geographic_score_v11.py \
                  tests/test_geographic_score_v11_candidate.py \
                  analysis/igr_v11_candidate3_diagnostics.json
          if ! git diff --cached --quiet; then
            git commit -m "IGR v1.1 candidate.3: estabiliza anomalía temporal"
            git push origin HEAD:experiment/igr-v11-c3-anomaly-shrink
          fi
