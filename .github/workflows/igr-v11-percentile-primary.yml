name: IGR v1.1 score + percentile validation

on:
  push:
    branches: [release/igr-v11-production]
    paths:
      - 'scripts/patch_igr_v11_percentile_primary.py'
      - '.github/workflows/igr-v11-percentile-primary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/igr-v11-production
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Aplicar lectura score + percentil
        run: python scripts/patch_igr_v11_percentile_primary.py

      - name: Restaurar datos y baseline RC1
        shell: bash
        run: |
          git fetch origin radar-data || true
          mkdir -p data/processed data/evidence
          git show origin/radar-data:data/processed/cead_geographic_score_v11_candidate.json > /tmp/igr_rc1_before.json
          for f in \
            cead_update_manifest.json \
            cead_annual_master_v4.jsonl \
            cead_official_secondary_control.jsonl \
            censo2024_population_commune.json; do
              git show "origin/radar-data:data/processed/$f" > "data/processed/$f" 2>/dev/null || rm -f "data/processed/$f"
          done
          rm -f data/processed/cead_direct_annual_cache.jsonl

      - name: Ejecutar pruebas
        run: pytest -q

      - name: Materializar Radar sin publicar
        run: python run.py --offline

      - name: Verificar que score y confianza no cambiaron
        shell: python
        run: |
          import json
          from pathlib import Path

          before = json.loads(Path('/tmp/igr_rc1_before.json').read_text(encoding='utf-8'))
          after = json.loads(Path('data/processed/cead_geographic_score_v11_candidate.json').read_text(encoding='utf-8'))
          b = {r['territory_id']: r for r in before}
          a = {r['territory_id']: r for r in after}
          common = sorted(set(a) & set(b))
          assert len(common) == 345, len(common)
          max_score_diff = max(abs(float(a[t]['score']) - float(b[t]['score'])) for t in common)
          max_conf_diff = max(abs(float(a[t]['confidence']) - float(b[t]['confidence'])) for t in common)
          assert max_score_diff == 0.0, max_score_diff
          assert max_conf_diff == 0.0, max_conf_diff
          assert all('national_percentile' in a[t] for t in common)
          assert all(0.0 <= float(a[t]['national_percentile']) <= 100.0 for t in common)
          assert min(float(a[t]['national_percentile']) for t in common) == 0.0
          assert max(float(a[t]['national_percentile']) for t in common) == 100.0
          print(json.dumps({
              'communes': len(common),
              'max_score_diff': max_score_diff,
              'max_confidence_diff': max_conf_diff,
              'percentile_min': min(float(a[t]['national_percentile']) for t in common),
              'percentile_max': max(float(a[t]['national_percentile']) for t in common),
          }))

      - name: Guardar cambios validados
        shell: bash
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add config/cead_geographic_score_v11_candidate.json radar_delictual/geographic_score_v11.py tests/test_geographic_score_v11_rc1.py
          if ! git diff --cached --quiet; then
            git commit -m "IGR v1.1 RC1: score y percentil como lectura primaria"
            git push origin HEAD:release/igr-v11-production
          fi
