name: IGR v1.1 candidate.3 calibration review

on:
  push:
    branches: [experiment/igr-v11-c3-anomaly-shrink]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/igr-v11-c3-anomaly-shrink
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restaurar datos de evaluación
        shell: bash
        run: |
          git fetch origin radar-data
          mkdir -p data/processed public analysis
          git show origin/radar-data:data/processed/cead_annual_master_v4.jsonl > data/processed/cead_annual_master_v4.jsonl
          git show origin/radar-data:data/processed/censo2024_population_commune.json > data/processed/censo2024_population_commune.json
          git show origin/radar-data:data/processed/cead_geographic_score_v1.json > data/processed/cead_geographic_score_v1.json
          echo '{}' > public/data.json

      - name: Materializar candidate.3
        run: |
          python - <<'PY'
          from radar_delictual.geographic_score_v11_runtime import materialize_geographic_score_v11_candidate
          result = materialize_geographic_score_v11_candidate(offline=True)
          if not result.get('ok') or result.get('records', 0) < 300:
              raise SystemExit(result)
          print(result['score_version'], result['records'])
          PY

      - name: Evaluar bandas provisionales
        run: python scripts/analyze_igr_v11_candidate3_calibration.py

      - name: Guardar revisión
        shell: bash
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add analysis/igr_v11_candidate3_calibrated_changes.json
          if ! git diff --cached --quiet; then
            git commit -m "IGR v1.1 candidate.3: revisa cambios con bandas provisionales"
            git push origin HEAD:experiment/igr-v11-c3-anomaly-shrink
          fi
